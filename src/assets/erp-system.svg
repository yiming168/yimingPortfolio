    <rect x="410" y="238" width="152" height="60" rx="14"/>
    <rect x="78" y="312" width="152" height="60" rx="14"/>
    <rect x="244" y="312" width="152" height="60" rx="14"/>
    <rect x="410" y="312" width="152" height="60" rx="14"/>
