  <text x="320" y="136" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0a5a99" text-anchor="middle">erp-demo.newbio.net</text>
  <g fill="#e3edf7" stroke="#aebeda" stroke-width="3">
    <rect x="78" y="164" width="152" height="60" rx="14"/>
    <rect x="244" y="164" width="152" height="60" rx="14"/>
    <rect x="410" y="164" width="152" height="60" rx="14"/>
