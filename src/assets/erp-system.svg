<svg xmlns="http://www.w3.org/2000/svg" width="640" height="424" viewBox="0 0 640 424" role="img" aria-labelledby="title desc">
  <title id="title">ERP system dashboard</title>
  <desc id="desc">A dashboard illustration with customer, contract, shipment, product, invoice, inventory, stock movement, procurement, and report modules, styled in Newbio brand blue.</desc>
  <rect width="640" height="424" rx="28" fill="#eef3f8"/>
  <rect x="58" y="52" width="524" height="336" rx="22" fill="#ffffff" stroke="#c9d6e4" stroke-width="4"/>
  <rect x="58" y="52" width="524" height="64" rx="22" fill="#053d6a"/>
  <circle cx="98" cy="84" r="9" fill="#e85d75"/>
  <circle cx="126" cy="84" r="9" fill="#f2b84b"/>
  <circle cx="154" cy="84" r="9" fill="#4fb06d"/>
  <text x="184" y="92" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Baifude ERP / CRM</text>
  <rect x="486" y="68" width="70" height="32" rx="16" fill="#00b6a8"/>
  <text x="521" y="90" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">DEMO</text>
